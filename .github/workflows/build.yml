name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            tests: build/VocalystTests_artefacts/Release/VocalystTests
          - name: Windows
            os: windows-2022
            cmake_extra: ""
            tests: build/VocalystTests_artefacts/Release/VocalystTests.exe
          - name: Linux
            os: ubuntu-22.04
            cmake_extra: ""
            tests: build/VocalystTests_artefacts/Release/VocalystTests

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev \
            libgl1-mesa-dev libglu1-mesa-dev ninja-build

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ${{ matrix.cmake_extra }}

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Run offline tests
        shell: bash
        run: ${{ matrix.tests }}

      # ---------------------------------------------------------------- macOS
      - name: Sign (ad-hoc) and package macOS bundles
        if: runner.os == 'macOS'
        run: |
          set -e
          OUT=dist/Vocalyst-macOS
          mkdir -p "$OUT/VST3" "$OUT/AU" "$OUT/Standalone"
          for bundle in build/Vocalyst_artefacts/Release/VST3/*.vst3 build/VocalystAutoKey_artefacts/Release/VST3/*.vst3; do
            codesign --force --deep --sign - "$bundle"
            cp -R "$bundle" "$OUT/VST3/"
          done
          for bundle in build/Vocalyst_artefacts/Release/AU/*.component build/VocalystAutoKey_artefacts/Release/AU/*.component; do
            codesign --force --deep --sign - "$bundle"
            cp -R "$bundle" "$OUT/AU/"
          done
          for app in build/Vocalyst_artefacts/Release/Standalone/*.app build/VocalystAutoKey_artefacts/Release/Standalone/*.app; do
            codesign --force --deep --sign - "$app"
            cp -R "$app" "$OUT/Standalone/"
          done
          cp docs/INSTALL-macOS.md "$OUT/README.txt"
          lipo -archs "build/Vocalyst_artefacts/Release/VST3/Vocalyst.vst3/Contents/MacOS/Vocalyst"
          cd dist && ditto -c -k --keepParent Vocalyst-macOS Vocalyst-macOS.zip

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Vocalyst-macOS
          path: dist/Vocalyst-macOS.zip

      - name: Validate VST3 with pluginval (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests --timeout-ms 120000 \
            "build/Vocalyst_artefacts/Release/VST3/Vocalyst.vst3"
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests --timeout-ms 120000 \
            "build/VocalystAutoKey_artefacts/Release/VST3/Vocalyst Auto Key.vst3"

      - name: Validate AU with auval (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Vocalyst_artefacts/Release/AU/Vocalyst.component ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/VocalystAutoKey_artefacts/Release/AU/Vocalyst Auto Key.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Vcl1 Anym
          auval -v aufx Vcak Anym

      # -------------------------------------------------------------- Windows
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          OUT=dist/Vocalyst-Windows
          mkdir -p "$OUT/VST3" "$OUT/Standalone"
          cp -R build/Vocalyst_artefacts/Release/VST3/*.vst3 "$OUT/VST3/"
          cp -R build/VocalystAutoKey_artefacts/Release/VST3/*.vst3 "$OUT/VST3/"
          cp build/Vocalyst_artefacts/Release/Standalone/*.exe "$OUT/Standalone/"
          cp build/VocalystAutoKey_artefacts/Release/Standalone/*.exe "$OUT/Standalone/"
          cd dist && 7z a -r Vocalyst-Windows.zip Vocalyst-Windows > /dev/null

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Vocalyst-Windows
          path: dist/Vocalyst-Windows.zip

      # ---------------------------------------------------------------- Linux
      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          set -e
          OUT=dist/Vocalyst-Linux
          mkdir -p "$OUT/VST3" "$OUT/Standalone"
          cp -R build/Vocalyst_artefacts/Release/VST3/*.vst3 "$OUT/VST3/"
          cp -R build/VocalystAutoKey_artefacts/Release/VST3/*.vst3 "$OUT/VST3/"
          cp build/Vocalyst_artefacts/Release/Standalone/Vocalyst "$OUT/Standalone/"
          cp "build/VocalystAutoKey_artefacts/Release/Standalone/Vocalyst Auto Key" "$OUT/Standalone/"
          cd dist && tar czf Vocalyst-Linux.tar.gz Vocalyst-Linux

      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Vocalyst-Linux
          path: dist/Vocalyst-Linux.tar.gz

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes \
            artifacts/Vocalyst-macOS/Vocalyst-macOS.zip \
            artifacts/Vocalyst-Windows/Vocalyst-Windows.zip \
            artifacts/Vocalyst-Linux/Vocalyst-Linux.tar.gz
